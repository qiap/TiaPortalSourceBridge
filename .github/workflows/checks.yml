name: Offline regression
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build both engines and check
        shell: powershell
        run: ./tests/Run-Checks.ps1
